<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/roster/assets/manifest.json">
  <link rel="icon" href="/roster/assets/icon.svg" type="image/svg+xml">
  <title>Team · Roster</title>
  <link rel="stylesheet" href="/roster/assets/app.css">
  <style>
    .team-hero { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 14px 10px; }
    .team-id { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .team-logo { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--lime-dim); color: var(--lime); font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; }
    .team-id h1 { margin: 0; font-size: clamp(1.3rem, 5.5vw, 1.7rem); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-id p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
    .team-pos { margin-top: 8px; font-size: 0.78rem; color: var(--faint); font-weight: 600; }
    .team-hero .icon-btn { background: var(--surface-2); }
    .team-hero .icon-btn:disabled { background: transparent; }

    .slot-pos {
      flex: none;
      width: 46px;
      padding: 4px 0;
      border-radius: 8px;
      text-align: center;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: var(--surface-3);
      color: var(--lime);
    }
    .player-empty { color: var(--faint); font-weight: 500; }
    .ui-row.static { min-height: 52px; }

    .roster-unit + .roster-unit { margin-top: 18px; }
    .roster-pos-head { padding: 10px 16px 6px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); border-top: 1px solid var(--line); }
    .ui-list > .roster-pos-head:first-child { border-top: 0; }
    .ui-segment { margin-bottom: 12px; }
    #more svg { transition: transform 0.2s; }
    #more[aria-expanded="true"] svg { transform: rotate(180deg); }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="icon-btn" href="../" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <p class="appbar-title">Team</p>
      <span></span>
    </div>
  </header>

  <main class="page">
    <div id="loading" aria-hidden="true">
      <div class="ui-skeleton" style="height:170px"></div>
      <div class="ui-skeleton"></div>
      <div class="ui-skeleton"></div>
    </div>

    <div class="ui-empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 5.5 2.5 10l3 1.2V21h13v-9.8l3-1.2L20 5.5 16 3c-.6 1.6-2.2 2.6-4 2.6S8.6 4.6 8 3z"/></svg>
      <h2 id="empty-title">No league picked</h2>
      <p id="empty-text">Pick or make a league on the home screen first.</p>
      <a class="ui-btn primary" href="../">Go to home</a>
    </div>

    <div id="team-body" hidden>
      <div class="ui-card team-hero">
        <button class="icon-btn" type="button" id="prev" aria-label="Previous team">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="team-id">
          <div class="team-logo" id="team-logo" aria-hidden="true"></div>
          <h1 id="team-name">Team</h1>
          <p id="team-owner"></p>
          <span class="team-pos" id="team-pos"></span>
        </div>
        <button class="icon-btn" type="button" id="next" aria-label="Next team">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <section class="ui-section">
        <div class="ui-segment" role="group" aria-label="Unit" id="units"></div>
        <div class="ui-section-head">
          <h2 class="ui-section-title">Starters</h2>
          <span class="ui-section-meta" id="starter-count"></span>
        </div>
        <ul class="ui-list" id="starters"></ul>
      </section>

      <section class="ui-section">
        <div class="ui-section-head">
          <h2 class="ui-section-title">Full roster</h2>
          <span class="ui-section-meta" id="roster-count"></span>
        </div>
        <button type="button" class="ui-btn block" id="more" aria-expanded="false" aria-controls="groups">
          <span id="more-label">More players</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="groups" style="margin-top:12px" hidden></div>
      </section>

      <section class="ui-section" id="rename" style="text-align:center" hidden>
        <button class="ui-link" id="rename-open" type="button">Rename team</button>
        <form class="ui-card ui-form" id="rename-form" style="text-align:left" hidden>
          <label class="ui-field">Your team name
            <input class="ui-input" id="rename-input" type="text" maxlength="40" required>
          </label>
          <button class="ui-btn primary block" type="submit">Save name</button>
          <p class="ui-msg" id="rename-msg" role="alert"></p>
        </form>
      </section>
    </div>
  </main>
  <div class="app-toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // ESPN-style team page: step through the league's teams, see each team's
    // starters on offense, defense, and special teams, and open the full
    // 53-man roster. Drafted players fill the starter slots in draft order;
    // free agency fills the rest later.
    (function () {
      var KEY = "roster_league";
      // Starting lineup: QB, RB, 3 WR, TE, and one NFL team's whole O-line on
      // offense, 11 on defense (4-3), and the specialists.
      var UNITS = [
        { id: "offense", label: "Offense", starters: ["QB", "RB", "WR", "WR", "WR", "TE", "OL"], positions: ["QB", "RB", "WR", "TE", "OL"] },
        { id: "defense", label: "Defense", starters: ["DE", "DT", "DT", "DE", "LB", "LB", "LB", "CB", "CB", "S", "S"], positions: ["DE", "DT", "LB", "CB", "S"] },
        { id: "special", label: "Special teams", starters: ["K", "P", "LS"], positions: ["K", "P", "LS"] }
      ];
      var NAMES = { QB: "Quarterbacks", RB: "Running backs", WR: "Wide receivers", TE: "Tight ends",
        OL: "Offensive line", DE: "Defensive ends", DT: "Defensive tackles",
        LB: "Linebackers", CB: "Cornerbacks", S: "Safeties", K: "Kickers", P: "Punters", LS: "Long snappers" };
      var TOTAL_ROSTER = 53;

      var loading = document.getElementById("loading");
      var empty = document.getElementById("empty");
      var body = document.getElementById("team-body");
      var teams = [];
      var index = 0;
      var unit = UNITS[0];
      var me = null;
      var players = []; // drafted players: { owner, name, pos, team }
      // Linemen picked one by one before O-lines became a single pick count as O-line.
      var LINEMEN = ["C", "G", "T"];

      function auth() { return window.rosterAuth && window.rosterAuth.current(); }

      function api(path, method, data) {
        var saved = auth();
        return fetch(path, {
          method: method || "GET",
          headers: { "Content-Type": "application/json", Authorization: saved ? saved.token : "" },
          body: data ? JSON.stringify(data) : undefined
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) throw new Error(json.message || "Something went wrong.");
            return json;
          });
        });
      }

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function initials(text) {
        var words = String(text || "").trim().split(/\s+/).filter(Boolean);
        return (words.slice(0, 2).map(function (w) { return w.charAt(0); }).join("") || "?").toUpperCase();
      }

      function toast(text) {
        var t = document.getElementById("toast");
        t.textContent = text;
        setTimeout(function () { if (t.textContent === text) t.textContent = ""; }, 2500);
      }

      function playerRow(pos, player) {
        var li = el("li");
        var row = el("div", "ui-row static");
        row.appendChild(el("span", "slot-pos", pos));
        var main = el("span", "ui-row-main");
        if (player) {
          main.appendChild(el("span", "ui-row-title", player.name));
          if (player.team) main.appendChild(el("span", "ui-row-sub", player.team));
        } else {
          main.appendChild(el("span", "ui-row-title player-empty", "Empty"));
        }
        row.appendChild(main);
        li.appendChild(row);
        return li;
      }

      function renderUnits() {
        var wrap = document.getElementById("units");
        wrap.textContent = "";
        UNITS.forEach(function (u) {
          var b = el("button", "", u.label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(u === unit));
          b.addEventListener("click", function () { unit = u; renderUnits(); renderTeam(); });
          wrap.appendChild(b);
        });
      }

      function renderTeam() {
        var team = teams[index];
        document.getElementById("team-name").textContent = team.name;
        document.getElementById("team-owner").textContent = team.ownerName || "Owner";
        document.getElementById("team-logo").textContent = initials(team.name);
        document.getElementById("team-pos").textContent = "Team " + (index + 1) + " of " + teams.length;
        document.getElementById("prev").disabled = index <= 0;
        document.getElementById("next").disabled = index >= teams.length - 1;
        document.title = team.name + " · Roster";

        var teamPlayers = players.filter(function (p) { return p.owner === team.user; });

        // Fill starter slots with drafted players in draft order.
        var used = {};
        var lineup = {};
        var filled = 0;
        var totalStarters = 0;
        UNITS.forEach(function (u) {
          lineup[u.id] = u.starters.map(function (slot) {
            totalStarters++;
            var p = teamPlayers.filter(function (x, i) { return !used[i] && x.pos === slot; })[0];
            if (p) { used[teamPlayers.indexOf(p)] = true; filled++; }
            return p || null;
          });
        });

        var starters = document.getElementById("starters");
        starters.textContent = "";
        unit.starters.forEach(function (pos, i) { starters.appendChild(playerRow(pos, lineup[unit.id][i])); });
        document.getElementById("starter-count").textContent = filled + " of " + totalStarters + " set";

        var groups = document.getElementById("groups");
        groups.textContent = "";
        UNITS.forEach(function (u) {
          var block = el("div", "roster-unit");
          var head = el("div", "ui-section-head");
          head.appendChild(el("h3", "ui-section-title", u.label));
          block.appendChild(head);
          var list = el("ul", "ui-list");
          u.positions.forEach(function (pos) {
            list.appendChild(el("li", "roster-pos-head", NAMES[pos]));
            var atPos = teamPlayers.filter(function (p) { return p.pos === pos; });
            if (atPos.length === 0) list.appendChild(playerRow(pos, null));
            atPos.forEach(function (p) { list.appendChild(playerRow(pos, p)); });
          });
          block.appendChild(list);
          groups.appendChild(block);
        });
        document.getElementById("roster-count").textContent = teamPlayers.length + " of " + TOTAL_ROSTER + " players";

        var mine = me && team.user === me.id;
        document.getElementById("rename").hidden = !mine;
        document.getElementById("rename-form").hidden = true;
        document.getElementById("rename-open").hidden = false;
        if (mine) document.getElementById("rename-input").value = team.name;

        if (history.replaceState) history.replaceState(null, "", "?team=" + encodeURIComponent(team.id));
      }

      document.getElementById("prev").addEventListener("click", function () {
        if (index > 0) { index--; renderTeam(); }
      });
      document.getElementById("next").addEventListener("click", function () {
        if (index < teams.length - 1) { index++; renderTeam(); }
      });
      document.getElementById("more").addEventListener("click", function () {
        var groups = document.getElementById("groups");
        var open = groups.hidden;
        groups.hidden = !open;
        this.setAttribute("aria-expanded", String(open));
        document.getElementById("more-label").textContent = open ? "Hide players" : "More players";
      });

      document.getElementById("rename-open").addEventListener("click", function () {
        this.hidden = true;
        document.getElementById("rename-form").hidden = false;
        document.getElementById("rename-input").focus();
      });

      document.getElementById("rename-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var team = teams[index];
        var msg = document.getElementById("rename-msg");
        msg.textContent = "";
        api("/api/collections/roster_teams/records/" + team.id, "PATCH", {
          name: document.getElementById("rename-input").value.trim()
        }).then(function (updated) {
          teams[index] = updated;
          renderTeam();
          toast("Team name saved");
        }).catch(function (err) { msg.textContent = err.message; });
      });

      function showEmpty(title, text) {
        loading.hidden = true;
        empty.hidden = false;
        if (title) document.getElementById("empty-title").textContent = title;
        if (text) document.getElementById("empty-text").textContent = text;
      }

      var leagueId = null;
      try { leagueId = localStorage.getItem(KEY); } catch (e) { leagueId = null; }
      if (!leagueId) {
        showEmpty();
        return;
      }

      var filter = encodeURIComponent('league="' + leagueId + '"');
      me = auth();
      Promise.all([
        api("/api/collections/roster_teams/records?filter=" + filter + "&perPage=100&sort=created"),
        api("/api/collections/roster_draft_picks/records?filter=" + filter + "&perPage=500&sort=pickNo")
      ]).then(function (results) {
        var data = results[0];
        players = results[1].items.map(function (p) {
          var pos = LINEMEN.indexOf(p.playerPos) >= 0 ? "OL" : p.playerPos;
          return { owner: p.user, name: p.playerName, pos: pos, team: p.playerTeam };
        });
        teams = data.items;
        if (!teams.length) {
          showEmpty("No teams yet", "Name your team on the home screen and it will show up here.");
          return;
        }
        var wanted = new URLSearchParams(location.search).get("team");
        var pickedIndex = -1;
        var mineIndex = -1;
        teams.forEach(function (t, i) {
          if (t.id === wanted) pickedIndex = i;
          if (me && t.user === me.id) mineIndex = i;
        });
        index = pickedIndex >= 0 ? pickedIndex : (mineIndex >= 0 ? mineIndex : 0);
        loading.hidden = true;
        body.hidden = false;
        renderUnits();
        renderTeam();
      }).catch(function (err) {
        showEmpty("Couldn't load teams", err.message);
      });
    })();
  </script>
  <script src="/roster/assets/app.js"></script>
</body>
</html>
