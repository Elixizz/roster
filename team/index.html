<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your team · Roster</title>
  <style>
    :root { --bg: #f7f7f5; --text: #1d1d1f; --muted: #6b6b70; --accent: #2f6fdb; --line: #d9d9d6; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161618; --text: #ecece9; --muted: #9a9aa0; --accent: #7aa7ff; --line: #3a3a40; }
    }
    :root[data-theme="dark"] { --bg: #161618; --text: #ecece9; --muted: #9a9aa0; --accent: #7aa7ff; --line: #3a3a40; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main { text-align: center; max-width: 560px; width: 100%; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Your team</h1>
    <p>Coming soon.</p>
    <a href="../">← Back to Roster</a>
  </main>
</body>
</html>
