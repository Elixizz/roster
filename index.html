<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Your team, free agency</title>
  <meta name="description" content="Your team. Free agency.">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --lime: #a3ff12;
      --lime-text: #000000;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .site-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sync-btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--text);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .sync-btn:hover { border-color: var(--lime); color: var(--lime); }
    .sync-btn:disabled { opacity: 0.5; cursor: default; }
    .sync-status { font-size: 0.8rem; color: var(--text); opacity: 0.7; }
    .site-header h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 48px;
    }
    .content { max-width: 560px; width: 100%; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .hero-buttons .btn { flex: 0 0 calc(50% - 6px); }
    .btn.hero {
      background: var(--lime);
      color: var(--lime-text);
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      padding: 28px 16px;
      border: 2px solid var(--lime);
      border-radius: 14px;
    }
    .btn.hero:hover { filter: brightness(1.08); }
    .btn.hero.outline {
      background: transparent;
      color: var(--lime);
    }
    .btn.hero.outline:hover { background: var(--lime); color: var(--lime-text); filter: none; }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    @media (max-width: 420px) {
      .hero-buttons .btn { flex-basis: 100%; }
    }
    /* Desktop: buttons in a single column down the left side */
    @media (min-width: 768px) {
      main {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 16px 24px 48px;
      }
      .content { max-width: 300px; }
      .hero-buttons { flex-direction: column; flex-wrap: nowrap; }
      .hero-buttons .btn { flex: none; width: 100%; }
      .btn.hero { font-size: 1.3rem; padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Roster</h1>
    <div>
      <button class="sync-btn" id="sync-btn" type="button">Sync</button>
      <span class="sync-status" id="sync-status" role="status"></span>
    </div>
  </header>
  <script>
    (function () {
      var btn = document.getElementById("sync-btn");
      var status = document.getElementById("sync-status");
      btn.addEventListener("click", function () {
        btn.disabled = true;
        status.textContent = "Syncing...";
        fetch("api/sync", { method: "POST" })
          .then(function (res) {
            if (res.ok) {
              status.textContent = "Synced. Reloading...";
              setTimeout(function () { location.reload(); }, 800);
              return;
            }
            status.textContent = res.status === 429
              ? "Synced recently. Try again in a minute."
              : "Sync failed.";
            btn.disabled = false;
          })
          .catch(function () {
            status.textContent = "Sync failed.";
            btn.disabled = false;
          });
      });
    })();
  </script>

  <main>
    <div class="content">
      <nav class="hero-buttons">
        <a class="btn hero" href="team/">Your team</a>
        <a class="btn hero outline" href="free-agency/">Your free agency</a>
        <a class="btn hero outline" href="picks/">Draft picks</a>
        <a class="btn hero outline" href="league/">View league</a>
        <a class="btn hero outline" href="matchup/">View matchup</a>
      </nav>
    </div>
  </main>
</body>
</html>
