<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Your team, free agency</title>
  <meta name="description" content="Your team. Free agency.">
  <style>
    :root {
      --bg: #000000; --bg-gradient: radial-gradient(120% 90% at 0% 0%, #1a2c04 0%, #0b1402 32%, transparent 62%), radial-gradient(120% 90% at 100% 100%, #1a2c04 0%, #0b1402 32%, transparent 62%);
      --text: #ffffff;
      --lime: #a3ff12;
      --lime-text: #000000;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background-color: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed;
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .site-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sync-btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--text);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .sync-btn:hover { border-color: var(--lime); color: var(--lime); }
    .sync-btn:disabled { opacity: 0.5; cursor: default; }
    .sync-status { font-size: 0.8rem; color: var(--text); opacity: 0.7; }
    .site-header h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 32px;
    }
    .content { max-width: 560px; width: 100%; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .hero-buttons .btn { flex: 0 0 calc(50% - 6px); }
    .btn.hero {
      background: var(--lime);
      color: var(--lime-text);
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      padding: 28px 16px;
      border: 2px solid var(--lime);
      border-radius: 14px;
    }
    .btn.hero:hover { filter: brightness(1.08); }
    .btn.hero.outline {
      background: transparent;
      color: var(--lime);
    }
    .btn.hero.outline:hover { background: var(--lime); color: var(--lime-text); filter: none; }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    @media (max-width: 420px) {
      .hero-buttons .btn { flex-basis: 100%; }
    }
    /* NFL scores */
    /* Scores bar: full width, flush against the bottom of the screen */
    .scores {
      width: 100%;
      text-align: left;
      padding: 14px 24px 16px;
      background: rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-top: 1px solid #22300c;
      /* Stays pinned to the bottom of the screen while the page scrolls */
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .scores-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .scores-head h2 { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; }
    .scores-updated { font-size: 0.8rem; opacity: 0.6; }
    /* Scores scroll continuously from left to right. People can drag or swipe the
       row; hovering pauses it, and it picks up again a moment after they let go. */
    .games {
      overflow: hidden;
      cursor: grab;
      touch-action: pan-y; /* vertical swipes still scroll the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
    }
    .games.dragging { cursor: grabbing; }
    .games:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
    .track { display: flex; gap: 12px; width: max-content; will-change: transform; }
    .track img { pointer-events: none; -webkit-user-drag: none; }
    .game { flex: none; width: 240px; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 14px; background: #0d0d0d; }
    .game.live { border-color: var(--lime); }
    .game-status { font-size: 0.8rem; opacity: 0.7; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .game.live .game-status { color: var(--lime); opacity: 1; font-weight: 700; }
    .team-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
    .team-row img { width: 26px; height: 26px; object-fit: contain; flex: none; }
    .team-row .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-row .rec { font-size: 0.75rem; opacity: 0.55; font-weight: 400; margin-left: 4px; }
    .team-row .score { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .game.final .team-row.loser { opacity: 0.5; }
    .team-row .poss { color: var(--lime); font-size: 0.7rem; margin-left: 4px; }
    .scores-msg { opacity: 0.7; font-size: 0.95rem; }

    /* Desktop: buttons in a single column down the left side */
    @media (min-width: 768px) {
      main {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 16px 24px 32px;
      }
      .content { max-width: 300px; }
      .hero-buttons { flex-direction: column; flex-wrap: nowrap; }
      .hero-buttons .btn { flex: none; width: 100%; }
      .btn.hero { font-size: 1.3rem; padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <header class="site-header">
    <h1>Roster</h1>
    <div>
      <button class="sync-btn" id="sync-btn" type="button">Sync</button>
      <span class="sync-status" id="sync-status" role="status"></span>
    </div>
  </header>
  <script>
    (function () {
      var btn = document.getElementById("sync-btn");
      var status = document.getElementById("sync-status");
      btn.addEventListener("click", function () {
        btn.disabled = true;
        status.textContent = "Syncing...";
        fetch("api/sync", { method: "POST" })
          .then(function (res) {
            if (res.ok) {
              status.textContent = "Synced. Reloading...";
              setTimeout(function () { location.reload(); }, 800);
              return;
            }
            status.textContent = res.status === 429
              ? "Synced recently. Try again in a minute."
              : "Sync failed.";
            btn.disabled = false;
          })
          .catch(function () {
            status.textContent = "Sync failed.";
            btn.disabled = false;
          });
      });
    })();
  </script>

  <main>
    <div class="content">
      <nav class="hero-buttons">
        <a class="btn hero" href="team/">Your team</a>
        <a class="btn hero outline" href="free-agency/">Your free agency</a>
        <a class="btn hero outline" href="picks/">Draft picks</a>
        <a class="btn hero outline" href="league/">View league</a>
        <a class="btn hero outline" href="matchup/">View matchup</a>
      </nav>
    </div>

  </main>
  <section class="scores" aria-labelledby="scores-title">
    <div class="scores-head">
      <h2 id="scores-title">NFL scores</h2>
      <span class="scores-updated" id="scores-updated"></span>
    </div>
    <div class="games" id="games" tabindex="0" role="region" aria-label="This week's NFL games. Drag, swipe, or use the arrow keys to move through them."><p class="scores-msg">Loading this week's games…</p></div>
  </section>

  <script>
    // This week's NFL games and scores, from ESPN's public scoreboard feed.
    // Refreshes every minute while games are live, every 10 minutes otherwise.
    (function () {
      var URL = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
      var gamesEl = document.getElementById("games");
      var titleEl = document.getElementById("scores-title");
      var updatedEl = document.getElementById("scores-updated");
      var timer;

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function kickoff(iso) {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, { weekday: "short" }) + " " +
          d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      }

      function teamRow(c, game, possessionId) {
        var t = c.team || {};
        var rec = c.records && c.records[0] ? c.records[0].summary : "";
        var showScore = game.state !== "pre";
        var loser = game.state === "post" && c.winner === false;
        return '<div class="team-row' + (loser ? " loser" : "") + '">' +
          (t.logo ? '<img src="' + esc(t.logo) + '" alt="" loading="lazy">' : "") +
          '<span class="name">' + esc(t.shortDisplayName || t.displayName || t.abbreviation) +
          (rec ? '<span class="rec">' + esc(rec) + "</span>" : "") +
          (possessionId && possessionId === t.id ? '<span class="poss" title="Has the ball">●</span>' : "") +
          "</span>" +
          (showScore ? '<span class="score">' + esc(c.score) + "</span>" : "") +
          "</div>";
      }

      function render(data) {
        var events = (data.events || []).slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        var week = data.week && data.week.number;
        var type = data.season && data.season.type;
        titleEl.textContent = type === 3 ? "NFL playoffs" : type === 1 ? "NFL preseason" + (week ? " week " + week : "") : "NFL week " + (week || "");

        if (!events.length) {
          lastCards = "";
          gamesEl.innerHTML = '<p class="scores-msg">No NFL games this week.</p>';
          return false;
        }

        var anyLive = false;
        var cards = events.map(function (e) {
          var comp = (e.competitions || [])[0] || {};
          var st = (e.status && e.status.type) || {};
          var game = { state: st.state };
          if (st.state === "in") anyLive = true;
          var away = (comp.competitors || []).filter(function (c) { return c.homeAway === "away"; })[0];
          var home = (comp.competitors || []).filter(function (c) { return c.homeAway === "home"; })[0];
          if (!away || !home) return "";
          var tv = comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names ? comp.broadcasts[0].names.join(", ") : "";
          var left = st.state === "pre" ? kickoff(e.date) : (st.shortDetail || st.detail || "");
          var right = st.state === "pre" ? tv : (st.state === "in" && comp.situation && comp.situation.downDistanceText) || "";
          var poss = st.state === "in" && comp.situation ? comp.situation.possession : null;
          var cls = st.state === "in" ? " live" : st.state === "post" ? " final" : "";
          return '<article class="game' + cls + '">' +
            '<div class="game-status"><span>' + esc(left) + "</span><span>" + esc(right) + "</span></div>" +
            teamRow(away, game, poss) + teamRow(home, game, poss) +
            "</article>";
        }).join("");
        lastCards = cards;
        layoutTicker();
        return anyLive;
      }

      // Repeat the games until one set fills the screen, then double it so the
      // loop is seamless. The row moves right; once it has moved one whole set
      // it wraps back, which looks identical.
      var lastCards = "";
      var CARD_STEP = 252;  // card width + gap
      var SPEED = 40;       // auto-scroll speed, pixels per second
      var RESUME_MS = 2000; // pause after someone drags before auto-scroll resumes
      var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var track = null, setWidth = 0, offset = 0;

      function layoutTicker() {
        if (!lastCards) { track = null; setWidth = 0; return; }
        var count = (lastCards.match(/<article/g) || []).length || 1;
        var repeats = Math.max(1, Math.ceil(gamesEl.clientWidth / (count * CARD_STEP)));
        var set = new Array(repeats + 1).join(lastCards);
        track = gamesEl.querySelector(".track");
        if (!track) {
          gamesEl.innerHTML = '<div class="track"></div>';
          track = gamesEl.firstChild;
        }
        // Second copy is hidden from screen readers so each game is read once.
        track.innerHTML = set + set.replace(/<article /g, '<article aria-hidden="true" ');
        setWidth = count * repeats * CARD_STEP;
        applyOffset();
      }

      function applyOffset() {
        if (!track || !setWidth) return;
        var x = ((offset % setWidth) + setWidth) % setWidth;
        track.style.transform = "translateX(" + (x - setWidth) + "px)";
      }

      // Auto-scroll
      var dragging = false, hovering = false, resumeAt = 0, lastFrame = 0;
      function frame(t) {
        var dt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.1) : 0;
        lastFrame = t;
        if (!reduceMotion && !dragging && !hovering && t >= resumeAt) {
          offset += SPEED * dt;
          applyOffset();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      function pauseBriefly() { resumeAt = performance.now() + RESUME_MS; }

      // Drag with a mouse, or swipe on a touch screen
      var startX = 0, startOffset = 0;
      gamesEl.addEventListener("pointerdown", function (e) {
        if (!track || (e.pointerType === "mouse" && e.button !== 0)) return;
        dragging = true;
        startX = e.clientX;
        startOffset = offset;
        gamesEl.classList.add("dragging");
        try { gamesEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      gamesEl.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        offset = startOffset + (e.clientX - startX);
        applyOffset();
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        gamesEl.classList.remove("dragging");
        pauseBriefly();
      }
      gamesEl.addEventListener("pointerup", endDrag);
      gamesEl.addEventListener("pointercancel", endDrag);

      // Hovering with a mouse pauses the row so a score can be read
      gamesEl.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") hovering = true; });
      gamesEl.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hovering = false; });

      // Sideways trackpad scrolling
      gamesEl.addEventListener("wheel", function (e) {
        if (!track || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault();
        offset -= e.deltaX;
        applyOffset();
        pauseBriefly();
      }, { passive: false });

      // Arrow keys move one game at a time
      gamesEl.addEventListener("keydown", function (e) {
        if (!track || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
        e.preventDefault();
        offset += e.key === "ArrowRight" ? CARD_STEP : -CARD_STEP;
        applyOffset();
        pauseBriefly();
      });

      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layoutTicker, 200);
      });

      function load() {
        clearTimeout(timer);
        fetch(URL, { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (data) {
            var live = render(data);
            updatedEl.textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
            timer = setTimeout(load, live ? 60000 : 600000);
          })
          .catch(function () {
            if (!gamesEl.querySelector(".game")) {
              gamesEl.innerHTML = '<p class="scores-msg">Scores are unavailable right now. Try again in a few minutes.</p>';
            }
            timer = setTimeout(load, 120000);
          });
      }

      // Refresh straight away when someone comes back to the tab.
      document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
      load();
    })();
  </script>
</body>
</html>
