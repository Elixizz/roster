<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Your team, free agency</title>
  <meta name="description" content="Your team. Free agency.">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --lime: #a3ff12;
      --lime-text: #000000;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .site-header {
      padding: 20px 24px;
    }
    .site-header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 48px;
    }
    .content { max-width: 560px; width: 100%; }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
    }
    .btn.primary {
      background: transparent;
      border: 2px solid var(--lime);
      color: var(--lime);
    }
    .btn.primary:hover { background: var(--lime); color: var(--lime-text); }
    .hero-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 32px;
    }
    .btn.hero {
      background: var(--lime);
      color: var(--lime-text);
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      padding: 28px 16px;
      border-radius: 14px;
    }
    .btn.hero:hover { filter: brightness(1.08); }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    @media (max-width: 420px) {
      .hero-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Roster</h1>
  </header>

  <main>
    <div class="content">
      <nav class="hero-buttons">
        <a class="btn hero" href="team/">Your team</a>
        <a class="btn hero" href="free-agency/">Your free agency</a>
      </nav>

      <nav class="buttons">
        <a class="btn primary" href="picks/">Draft picks</a>
      </nav>
    </div>
  </main>
</body>
</html>
