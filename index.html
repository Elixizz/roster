<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Your team, free agency</title>
  <meta name="description" content="Your team. Free agency.">
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #2f6fdb;
      --accent-text: #ffffff;
      --line: #d9d9d6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161618;
        --text: #ecece9;
        --muted: #9a9aa0;
        --accent: #7aa7ff;
        --accent-text: #0d0d0f;
        --line: #3a3a40;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161618;
      --text: #ecece9;
      --muted: #9a9aa0;
      --accent: #7aa7ff;
      --accent-text: #0d0d0f;
      --line: #3a3a40;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .tagline {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid var(--line);
      text-decoration: none;
      font-weight: 600;
      color: var(--text);
      background: transparent;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .btn.primary:hover { opacity: 0.9; }
    .hero-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 20px;
    }
    .btn.hero {
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      padding: 28px 16px;
      border-radius: 14px;
      border-width: 2px;
    }
    @media (max-width: 420px) {
      .hero-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Roster</p>
    <nav class="hero-buttons">
      <a class="btn hero" href="team/">Your team</a>
      <a class="btn hero" href="free-agency/">Your free agency</a>
    </nav>
    <p class="tagline">Build your squad, keep your options open.</p>

    <nav class="buttons">
      <a class="btn primary" href="picks/">Draft picks</a>
    </nav>
  </main>
</body>
</html>
