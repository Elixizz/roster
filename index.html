<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster · Your team, free agency</title>
  <meta name="description" content="Your team. Free agency.">
  <style>
    :root {
      --bg: #000000; --bg-gradient: radial-gradient(120% 90% at 0% 0%, #1a2c04 0%, #0b1402 32%, transparent 62%), radial-gradient(120% 90% at 100% 100%, #1a2c04 0%, #0b1402 32%, transparent 62%);
      --text: #ffffff;
      --lime: #a3ff12;
      --lime-text: #000000;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background-color: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed;
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .site-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .sync-btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--text);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .sync-btn:hover { border-color: var(--lime); color: var(--lime); }
    .sync-btn:disabled { opacity: 0.5; cursor: default; }
    .sync-status { font-size: 0.8rem; color: var(--text); opacity: 0.7; }
    .site-header h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 32px;
    }
    .content { max-width: 560px; width: 100%; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
    }
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .hero-buttons .btn { flex: 0 0 calc(50% - 6px); }
    .btn.hero {
      background: var(--lime);
      color: var(--lime-text);
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      padding: 28px 16px;
      border: 2px solid var(--lime);
      border-radius: 14px;
    }
    .btn.hero:hover { filter: brightness(1.08); }
    .btn.hero.outline {
      background: transparent;
      color: var(--lime);
    }
    .btn.hero.outline:hover { background: var(--lime); color: var(--lime-text); filter: none; }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .section-title { font-size: 1.6rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 12px; }
    .muted { color: var(--text); opacity: 0.7; margin: 0 0 18px; }
    .league-list, .actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .actions { margin-bottom: 0; }
    .panel { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 0; text-align: left; }
    .panel label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; opacity: 0.8; }
    .panel input { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    .panel input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
    .code-input { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 700; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.2rem; letter-spacing: 0.2em; color: var(--lime); }
    .msg { min-height: 1.5em; margin: 12px 0 0; font-size: 0.9rem; color: #ff6b6b; }
    .link { font: inherit; background: none; border: none; color: var(--lime); cursor: pointer; padding: 16px 0 0; }
    .teams { margin: 0 0 24px; text-align: left; }
    .sub-title { font-size: 1.1rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 12px; }
    .team-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .team-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .team-card h4 { margin: 0; font-size: 1rem; font-weight: 700; }
    .team-card .owner { margin: 2px 0 8px; font-size: 0.85rem; opacity: 0.7; }
    .team-card .players { margin: 0; font-size: 0.85rem; opacity: 0.6; }
    @media (max-width: 420px) {
      .hero-buttons .btn { flex-basis: 100%; }
    }
    /* NFL scores */
    /* Scores bar: full width, flush against the bottom of the screen */
    .scores {
      width: 100%;
      text-align: left;
      padding: 14px 24px 16px;
      background: rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-top: 1px solid #22300c;
      /* Stays pinned to the bottom of the screen while the page scrolls */
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .scores-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .scores-head h2 { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; }
    .scores-updated { font-size: 0.8rem; opacity: 0.6; }
    /* Scores scroll continuously from left to right. People can drag or swipe the
       row; it only stops while being dragged. */
    .games {
      overflow: hidden;
      cursor: grab;
      touch-action: pan-y; /* vertical swipes still scroll the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent);
    }
    .games.dragging { cursor: grabbing; }
    .games:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
    .track { display: flex; gap: 12px; width: max-content; will-change: transform; }
    .track img { pointer-events: none; -webkit-user-drag: none; }
    .game { flex: none; width: 240px; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 14px; background: #0d0d0d; }
    .game.live { border-color: var(--lime); }
    .game-status { font-size: 0.8rem; opacity: 0.7; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .game.live .game-status { color: var(--lime); opacity: 1; font-weight: 700; }
    .team-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
    .team-row img { width: 26px; height: 26px; object-fit: contain; flex: none; }
    .team-row .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-row .rec { font-size: 0.75rem; opacity: 0.55; font-weight: 400; margin-left: 4px; }
    .team-row .score { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .game.final .team-row.loser { opacity: 0.5; }
    .team-row .poss { color: var(--lime); font-size: 0.7rem; margin-left: 4px; }
    .scores-msg { opacity: 0.7; font-size: 0.95rem; }

    /* Desktop: buttons in a single column, centered on the page */
    @media (min-width: 768px) {
      main { padding: 24px 24px 32px; }
      .content { max-width: 360px; }
      .hero-buttons { flex-direction: column; flex-wrap: nowrap; }
      .hero-buttons .btn { flex: none; width: 100%; }
      .btn.hero { font-size: 1.3rem; padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <header class="site-header">
    <h1>Roster</h1>
    <div>
      <button class="sync-btn" id="sync-btn" type="button">Sync</button>
      <span class="sync-status" id="sync-status" role="status"></span>
    </div>
  </header>
  <script>
    (function () {
      var btn = document.getElementById("sync-btn");
      var status = document.getElementById("sync-status");
      btn.addEventListener("click", function () {
        btn.disabled = true;
        status.textContent = "Syncing...";
        fetch("api/sync", { method: "POST" })
          .then(function (res) {
            if (res.ok) {
              status.textContent = "Synced. Reloading...";
              setTimeout(function () { location.reload(); }, 800);
              return;
            }
            status.textContent = res.status === 429
              ? "Synced recently. Try again in a minute."
              : "Sync failed.";
            btn.disabled = false;
          })
          .catch(function () {
            status.textContent = "Sync failed.";
            btn.disabled = false;
          });
      });
    })();
  </script>

  <main>
    <div class="content">
      <section id="league-picker" hidden>
        <h2 class="section-title">Pick a league</h2>
        <p class="muted" id="picker-empty" hidden>You're not in a league yet. Make one, or join with an invite code.</p>
        <nav class="league-list" id="league-list"></nav>
        <div class="actions">
          <button class="btn hero outline" id="show-create" type="button">Make new league</button>
          <button class="btn hero outline" id="show-join" type="button">Join with code</button>
        </div>
        <form class="panel" id="create-form" hidden>
          <label>League name
            <input id="league-name" type="text" maxlength="60" required>
          </label>
          <button class="btn hero" type="submit">Create league</button>
        </form>
        <form class="panel" id="join-form" hidden>
          <label>Invite code
            <input id="join-code" class="code-input" type="text" maxlength="6" minlength="6" autocomplete="off" required>
          </label>
          <button class="btn hero" type="submit">Join league</button>
        </form>
        <p class="msg" id="league-msg" role="alert"></p>
      </section>

      <section id="league-home" hidden>
        <h2 class="section-title" id="league-title"></h2>
        <p class="muted">Invite code: <strong class="code" id="league-code"></strong><br>Share it so others can join.</p>
        <div class="teams">
          <h3 class="sub-title">Teams</h3>
          <div class="team-list" id="team-list"></div>
          <p class="muted" id="unnamed-note" hidden></p>
          <form class="panel" id="team-form" hidden>
            <label>Your team name
              <input id="team-name" type="text" maxlength="40" required>
            </label>
            <button class="btn hero" type="submit">Save team name</button>
          </form>
          <p class="msg" id="team-msg" role="alert"></p>
        </div>
        <nav class="hero-buttons">
          <a class="btn hero" href="team/">Your team</a>
          <a class="btn hero outline" href="free-agency/">Your free agency</a>
          <a class="btn hero outline" href="picks/">Draft picks</a>
          <a class="btn hero outline" href="league/">View league</a>
          <a class="btn hero outline" href="matchup/">View matchup</a>
        </nav>
        <button class="link" id="switch-league" type="button">Switch league</button>
      </section>
    </div>

  </main>
  <script>
    // League picker: choose a league, make a new one, or join one with a code.
    (function () {
      var LEAGUES = "/api/collections/roster_league_members/records?expand=league&perPage=100&sort=created";
      var KEY = "roster_league";

      var picker = document.getElementById("league-picker");
      var home = document.getElementById("league-home");
      var list = document.getElementById("league-list");
      var empty = document.getElementById("picker-empty");
      var createForm = document.getElementById("create-form");
      var joinForm = document.getElementById("join-form");
      var nameInput = document.getElementById("league-name");
      var codeInput = document.getElementById("join-code");
      var msg = document.getElementById("league-msg");

      function token() {
        var saved = window.rosterAuth && window.rosterAuth.current();
        return saved ? saved.token : "";
      }

      function api(path, method, body) {
        var headers = { "Content-Type": "application/json", Authorization: token() };
        return fetch(path, {
          method: method || "GET",
          headers: headers,
          body: body ? JSON.stringify(body) : undefined
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (!res.ok) throw new Error(data.message || "Something went wrong.");
            return data;
          });
        });
      }

      function saveChoice(id) {
        try {
          if (id) localStorage.setItem(KEY, id);
          else localStorage.removeItem(KEY);
        } catch (e) { /* storage blocked: the picker just shows again */ }
      }

      function savedChoice() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }

      function showLeague(league) {
        saveChoice(league.id);
        document.getElementById("league-title").textContent = league.name;
        document.getElementById("league-code").textContent = league.code;
        picker.hidden = true;
        home.hidden = false;
        loadTeams(league.id);
      }

      function myId() {
        var saved = window.rosterAuth && window.rosterAuth.current();
        return saved ? saved.id : "";
      }

      // Each team shows its name, its owner, and its players. Players are not
      // assigned to teams yet, so every team shows "No players yet" for now.
      function loadTeams(leagueId) {
        var teamList = document.getElementById("team-list");
        var teamForm = document.getElementById("team-form");
        var teamName = document.getElementById("team-name");
        var teamMsg = document.getElementById("team-msg");
        var unnamed = document.getElementById("unnamed-note");
        var filter = encodeURIComponent('league="' + leagueId + '"');

        Promise.all([
          api("/api/collections/roster_teams/records?filter=" + filter + "&perPage=100&sort=created"),
          api("/api/collections/roster_league_members/records?filter=" + filter + "&perPage=100")
        ]).then(function (results) {
          var teams = results[0].items;
          var memberCount = results[1].totalItems;
          var mine = teams.filter(function (t) { return t.user === myId(); })[0];

          teamList.textContent = "";
          teams.forEach(function (team) {
            var card = document.createElement("div");
            card.className = "team-card";
            var name = document.createElement("h4");
            name.textContent = team.name;
            var owner = document.createElement("p");
            owner.className = "owner";
            owner.textContent = team.ownerName || "Owner";
            var players = document.createElement("p");
            players.className = "players";
            players.textContent = "No players yet";
            card.appendChild(name);
            card.appendChild(owner);
            card.appendChild(players);
            teamList.appendChild(card);
          });

          var missing = memberCount - teams.length;
          unnamed.hidden = missing <= 0;
          unnamed.textContent = missing === 1
            ? "One member hasn't named a team yet."
            : missing + " members haven't named a team yet.";

          teamForm.hidden = false;
          teamName.value = mine ? mine.name : "";
          teamForm.dataset.teamId = mine ? mine.id : "";
          teamMsg.textContent = "";
        }).catch(function (err) {
          document.getElementById("team-msg").textContent = err.message;
        });
      }

      document.getElementById("team-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var form = event.currentTarget;
        var teamMsg = document.getElementById("team-msg");
        var name = document.getElementById("team-name").value.trim();
        var leagueId = savedChoice();
        var teamId = form.dataset.teamId;
        var auth = window.rosterAuth && window.rosterAuth.current();
        var ownerName = auth && auth.name ? auth.name : "";

        teamMsg.textContent = "Saving...";
        var request = teamId
          ? api("/api/collections/roster_teams/records/" + teamId, "PATCH", { name: name })
          : api("/api/collections/roster_teams/records", "POST", {
              league: leagueId, user: myId(), name: name, ownerName: ownerName
            });

        request.then(function () {
          teamMsg.textContent = "";
          loadTeams(leagueId);
        }).catch(function (err) {
          teamMsg.textContent = err.message;
        });
      });

      function showPicker(leagues) {
        saveChoice(null);
        home.hidden = true;
        picker.hidden = false;
        list.textContent = "";
        empty.hidden = leagues.length > 0;
        leagues.forEach(function (league) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn hero outline";
          btn.textContent = league.name;
          btn.addEventListener("click", function () { showLeague(league); });
          list.appendChild(btn);
        });
      }

      function setMsg(text) { msg.textContent = text || ""; }

      document.getElementById("show-create").addEventListener("click", function () {
        createForm.hidden = !createForm.hidden;
        joinForm.hidden = true;
        setMsg("");
      });

      document.getElementById("show-join").addEventListener("click", function () {
        joinForm.hidden = !joinForm.hidden;
        createForm.hidden = true;
        setMsg("");
      });

      document.getElementById("switch-league").addEventListener("click", function () {
        api(LEAGUES).then(function (data) {
          showPicker(data.items.map(function (m) { return m.expand && m.expand.league; }).filter(Boolean));
        }).catch(function (err) { setMsg(err.message); });
      });

      createForm.addEventListener("submit", function (event) {
        event.preventDefault();
        setMsg("Creating league...");
        api("/api/roster/leagues", "POST", { name: nameInput.value.trim() })
          .then(function (data) { setMsg(""); showLeague(data.league); })
          .catch(function (err) { setMsg(err.message); });
      });

      joinForm.addEventListener("submit", function (event) {
        event.preventDefault();
        setMsg("Joining league...");
        api("/api/roster/join", "POST", { code: codeInput.value.trim().toUpperCase() })
          .then(function (data) { setMsg(""); showLeague(data.league); })
          .catch(function (err) { setMsg(err.message); });
      });

      api(LEAGUES).then(function (data) {
        var leagues = data.items.map(function (m) { return m.expand && m.expand.league; }).filter(Boolean);
        var saved = savedChoice();
        var current = leagues.filter(function (l) { return l.id === saved; })[0];
        if (current) showLeague(current);
        else showPicker(leagues);
      }).catch(function (err) {
        picker.hidden = false;
        setMsg(err.message);
      });
    })();
  </script>
  <section class="scores" aria-labelledby="scores-title">
    <div class="scores-head">
      <h2 id="scores-title">NFL scores</h2>
      <span class="scores-updated" id="scores-updated"></span>
    </div>
    <div class="games" id="games" tabindex="0" role="region" aria-label="This week's NFL games. Drag, swipe, or use the arrow keys to move through them."><p class="scores-msg">Loading this week's games…</p></div>
  </section>

  <script>
    // This week's NFL games and scores, from ESPN's public scoreboard feed.
    // Refreshes every minute while games are live, every 10 minutes otherwise.
    (function () {
      var URL = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
      var gamesEl = document.getElementById("games");
      var titleEl = document.getElementById("scores-title");
      var updatedEl = document.getElementById("scores-updated");
      var timer;

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function kickoff(iso) {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, { weekday: "short" }) + " " +
          d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      }

      function teamRow(c, game, possessionId) {
        var t = c.team || {};
        var rec = c.records && c.records[0] ? c.records[0].summary : "";
        var showScore = game.state !== "pre";
        var loser = game.state === "post" && c.winner === false;
        return '<div class="team-row' + (loser ? " loser" : "") + '">' +
          (t.logo ? '<img src="' + esc(t.logo) + '" alt="" loading="lazy">' : "") +
          '<span class="name">' + esc(t.shortDisplayName || t.displayName || t.abbreviation) +
          (rec ? '<span class="rec">' + esc(rec) + "</span>" : "") +
          (possessionId && possessionId === t.id ? '<span class="poss" title="Has the ball">●</span>' : "") +
          "</span>" +
          (showScore ? '<span class="score">' + esc(c.score) + "</span>" : "") +
          "</div>";
      }

      function render(data) {
        var events = (data.events || []).slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        var week = data.week && data.week.number;
        var type = data.season && data.season.type;
        titleEl.textContent = type === 3 ? "NFL playoffs" : type === 1 ? "NFL preseason" + (week ? " week " + week : "") : "NFL week " + (week || "");

        if (!events.length) {
          lastCards = "";
          gamesEl.innerHTML = '<p class="scores-msg">No NFL games this week.</p>';
          return false;
        }

        var anyLive = false;
        var cards = events.map(function (e) {
          var comp = (e.competitions || [])[0] || {};
          var st = (e.status && e.status.type) || {};
          var game = { state: st.state };
          if (st.state === "in") anyLive = true;
          var away = (comp.competitors || []).filter(function (c) { return c.homeAway === "away"; })[0];
          var home = (comp.competitors || []).filter(function (c) { return c.homeAway === "home"; })[0];
          if (!away || !home) return "";
          var tv = comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names ? comp.broadcasts[0].names.join(", ") : "";
          var left = st.state === "pre" ? kickoff(e.date) : (st.shortDetail || st.detail || "");
          var right = st.state === "pre" ? tv : (st.state === "in" && comp.situation && comp.situation.downDistanceText) || "";
          var poss = st.state === "in" && comp.situation ? comp.situation.possession : null;
          var cls = st.state === "in" ? " live" : st.state === "post" ? " final" : "";
          return '<article class="game' + cls + '">' +
            '<div class="game-status"><span>' + esc(left) + "</span><span>" + esc(right) + "</span></div>" +
            teamRow(away, game, poss) + teamRow(home, game, poss) +
            "</article>";
        }).join("");
        lastCards = cards;
        layoutTicker();
        return anyLive;
      }

      // Repeat the games until one set fills the screen, then double it so the
      // loop is seamless. The row moves right; once it has moved one whole set
      // it wraps back, which looks identical.
      var lastCards = "";
      var CARD_STEP = 252;  // card width + gap
      var SPEED = 40;       // auto-scroll speed, pixels per second
      var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var track = null, setWidth = 0, offset = 0;

      function layoutTicker() {
        if (!lastCards) { track = null; setWidth = 0; return; }
        var count = (lastCards.match(/<article/g) || []).length || 1;
        var repeats = Math.max(1, Math.ceil(gamesEl.clientWidth / (count * CARD_STEP)));
        var set = new Array(repeats + 1).join(lastCards);
        track = gamesEl.querySelector(".track");
        if (!track) {
          gamesEl.innerHTML = '<div class="track"></div>';
          track = gamesEl.firstChild;
        }
        // Second copy is hidden from screen readers so each game is read once.
        track.innerHTML = set + set.replace(/<article /g, '<article aria-hidden="true" ');
        setWidth = count * repeats * CARD_STEP;
        applyOffset();
      }

      function applyOffset() {
        if (!track || !setWidth) return;
        var x = ((offset % setWidth) + setWidth) % setWidth;
        track.style.transform = "translateX(" + (x - setWidth) + "px)";
      }

      // Auto-scroll
      var dragging = false, lastFrame = 0;
      function frame(t) {
        var dt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.1) : 0;
        lastFrame = t;
        if (!reduceMotion && !dragging) {
          offset += SPEED * dt;
          applyOffset();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Drag with a mouse, or swipe on a touch screen
      var startX = 0, startOffset = 0;
      gamesEl.addEventListener("pointerdown", function (e) {
        if (!track || (e.pointerType === "mouse" && e.button !== 0)) return;
        dragging = true;
        startX = e.clientX;
        startOffset = offset;
        gamesEl.classList.add("dragging");
        try { gamesEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      gamesEl.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        offset = startOffset + (e.clientX - startX);
        applyOffset();
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        gamesEl.classList.remove("dragging");
      }
      gamesEl.addEventListener("pointerup", endDrag);
      gamesEl.addEventListener("pointercancel", endDrag);


      // Sideways trackpad scrolling
      gamesEl.addEventListener("wheel", function (e) {
        if (!track || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault();
        offset -= e.deltaX;
        applyOffset();
      }, { passive: false });

      // Arrow keys move one game at a time
      gamesEl.addEventListener("keydown", function (e) {
        if (!track || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
        e.preventDefault();
        offset += e.key === "ArrowRight" ? CARD_STEP : -CARD_STEP;
        applyOffset();
      });

      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layoutTicker, 200);
      });

      function load() {
        clearTimeout(timer);
        fetch(URL, { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (data) {
            var live = render(data);
            updatedEl.textContent = "Updated " + new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
            timer = setTimeout(load, live ? 60000 : 600000);
          })
          .catch(function () {
            if (!gamesEl.querySelector(".game")) {
              gamesEl.innerHTML = '<p class="scores-msg">Scores are unavailable right now. Try again in a few minutes.</p>';
            }
            timer = setTimeout(load, 120000);
          });
      }

      // Refresh straight away when someone comes back to the tab.
      document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
      load();
    })();
  </script>
</body>
</html>
