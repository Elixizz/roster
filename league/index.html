<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/roster/assets/manifest.json">
  <link rel="icon" href="/roster/assets/icon.svg" type="image/svg+xml">
  <title>League · Roster</title>
  <link rel="stylesheet" href="/roster/assets/app.css">
  <style>
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 1.25rem; font-weight: 800; }
    .stat span { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .stat .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.18em; color: var(--lime); font-size: 1.05rem; }
    .rank { width: 28px; flex: none; text-align: center; font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums; }
    .ui-row.mine .rank { color: var(--lime); }
    .count { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="icon-btn" href="../" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <p class="appbar-title">League</p>
      <span></span>
    </div>
  </header>

  <main class="page">
    <div id="loading" aria-hidden="true">
      <div class="ui-skeleton" style="height:130px"></div>
      <div class="ui-skeleton"></div>
      <div class="ui-skeleton"></div>
    </div>

    <div class="ui-empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <h2>No league picked</h2>
      <p id="empty-text">Pick or make a league on the home screen first.</p>
      <a class="ui-btn primary" href="../">Go to home</a>
    </div>

    <div id="league-body" hidden>
      <div class="ui-card">
        <div class="page-head" style="margin:0">
          <h1 id="league-title">League</h1>
        </div>
        <div class="stats">
          <div class="stat"><b id="member-count">0</b><span>Members</span></div>
          <div class="stat"><b id="team-count">0</b><span>Teams</span></div>
          <div class="stat"><b class="code" id="league-code"></b><span>Invite code</span></div>
        </div>
      </div>

      <section class="ui-section">
        <div class="ui-section-head">
          <h2 class="ui-section-title">Teams</h2>
          <span class="ui-section-meta">Players</span>
        </div>
        <ul class="ui-list" id="team-rows"></ul>
        <p class="ui-note" id="unnamed-note" hidden></p>
      </section>
    </div>
  </main>
  <script>
    // League page: every team in the league in one list. Tap a team to open it.
    // Players are not assigned to teams yet, so each team shows 0 of 53 for now.
    (function () {
      var KEY = "roster_league";
      var ROSTER_SIZE = 53;
      var CHEVRON = '<svg class="ui-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
      var loading = document.getElementById("loading");
      var empty = document.getElementById("empty");
      var body = document.getElementById("league-body");
      var rows = document.getElementById("team-rows");

      function auth() { return window.rosterAuth && window.rosterAuth.current(); }

      function api(path) {
        var saved = auth();
        return fetch(path, {
          headers: { "Content-Type": "application/json", Authorization: saved ? saved.token : "" }
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) throw new Error(json.message || "Something went wrong.");
            return json;
          });
        });
      }

      function span(cls, text) {
        var s = document.createElement("span");
        s.className = cls;
        s.textContent = text;
        return s;
      }

      function showEmpty(text) {
        loading.hidden = true;
        empty.hidden = false;
        if (text) document.getElementById("empty-text").textContent = text;
      }

      var leagueId = null;
      try { leagueId = localStorage.getItem(KEY); } catch (e) { leagueId = null; }
      if (!leagueId) {
        showEmpty();
        return;
      }

      var filter = encodeURIComponent('league="' + leagueId + '"');
      var me = auth();

      Promise.all([
        api("/api/collections/roster_leagues/records/" + leagueId),
        api("/api/collections/roster_teams/records?filter=" + filter + "&perPage=100&sort=created"),
        api("/api/collections/roster_league_members/records?filter=" + filter + "&perPage=100")
      ]).then(function (results) {
        var league = results[0];
        var teams = results[1].items;
        var memberCount = results[2].totalItems;

        document.getElementById("league-title").textContent = league.name;
        document.getElementById("league-code").textContent = league.code;
        document.getElementById("member-count").textContent = memberCount;
        document.getElementById("team-count").textContent = teams.length;
        document.title = league.name + " · Roster";

        rows.textContent = "";
        teams.forEach(function (team, i) {
          var mine = me && team.user === me.id;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "ui-row" + (mine ? " mine" : "");
          a.href = "../team/?team=" + encodeURIComponent(team.id);
          a.appendChild(span("rank", String(i + 1)));
          var main = span("ui-row-main", "");
          var title = span("ui-row-title", team.name);
          if (mine) {
            title.appendChild(document.createTextNode(" "));
            title.appendChild(span("ui-badge", "You"));
          }
          main.appendChild(title);
          main.appendChild(span("ui-row-sub", team.ownerName || "Owner"));
          a.appendChild(main);
          a.appendChild(span("ui-row-end count", "0/" + ROSTER_SIZE));
          a.insertAdjacentHTML("beforeend", CHEVRON);
          li.appendChild(a);
          rows.appendChild(li);
        });
        rows.hidden = teams.length === 0;

        var missing = memberCount - teams.length;
        var note = document.getElementById("unnamed-note");
        note.hidden = missing <= 0;
        note.textContent = missing === 1
          ? "One member hasn't named a team yet."
          : missing + " members haven't named a team yet.";

        loading.hidden = true;
        body.hidden = false;
      }).catch(function (err) {
        showEmpty(err.message);
      });
    })();
  </script>
  <script src="/roster/assets/app.js"></script>
</body>
</html>
