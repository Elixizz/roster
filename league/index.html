<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League · Roster</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #a3a3a3;
      --lime: #a3ff12;
      --lime-text: #000000;
      --line: #2e2e34;
      --panel: #0d0d0f;
      --error: #ff6b6b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 48px;
    }
    main { max-width: 900px; margin: 0 auto; }
    .back { font-weight: 600; color: var(--lime); text-decoration: none; font-size: 0.9rem; }
    .back:hover { text-decoration: underline; }

    .league-head { margin: 14px 0 18px; }
    .league-head h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
    .league-head p { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em; color: var(--lime); }

    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 24px 0 10px; }
    .section-head h2 { margin: 0; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lime); }
    .section-head span { font-size: 0.85rem; color: var(--muted); }

    .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 12px 14px; text-align: left; white-space: nowrap; }
    th { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
    td { border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: none; }
    td.rank, th.rank { width: 48px; color: var(--muted); }
    td.num, th.num { text-align: right; }
    td.team { font-weight: 700; }
    td.owner { color: var(--muted); }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #141418; }
    tbody tr:focus-visible { outline: 2px solid var(--lime); outline-offset: -2px; }
    .team-link { color: var(--text); text-decoration: none; }
    .team-link:hover { color: var(--lime); text-decoration: underline; }
    tr.mine td.team::after { content: "You"; margin-left: 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lime-text); background: var(--lime); padding: 2px 6px; border-radius: 6px; vertical-align: middle; }
    .notice { color: var(--muted); margin: 40px 0; text-align: center; }
    .note { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <main>
    <a class="back" href="../">← Back to Roster</a>

    <p class="notice" id="empty" hidden>Pick a league on the home page first.</p>

    <div id="league-body" hidden>
      <header class="league-head">
        <h1 id="league-title">League</h1>
        <p>Invite code <span class="code" id="league-code"></span> · <span id="member-count"></span></p>
      </header>

      <div class="section-head">
        <h2>Teams</h2>
        <span id="team-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="rank">#</th>
              <th>Team</th>
              <th>Owner</th>
              <th class="num">Players</th>
            </tr>
          </thead>
          <tbody id="team-rows"></tbody>
        </table>
      </div>
      <p class="note" id="unnamed-note" hidden></p>
    </div>
  </main>
  <script>
    // ESPN-style league page: every team in the league in one table. Tap a row
    // to open that team. Players are not assigned to teams yet, so each team
    // shows 0 of 53 for now.
    (function () {
      var KEY = "roster_league";
      var ROSTER_SIZE = 53;
      var empty = document.getElementById("empty");
      var body = document.getElementById("league-body");
      var rows = document.getElementById("team-rows");

      function auth() { return window.rosterAuth && window.rosterAuth.current(); }

      function api(path) {
        var saved = auth();
        return fetch(path, {
          headers: { "Content-Type": "application/json", Authorization: saved ? saved.token : "" }
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) throw new Error(json.message || "Something went wrong.");
            return json;
          });
        });
      }

      function cell(cls, text) {
        var td = document.createElement("td");
        if (cls) td.className = cls;
        td.textContent = text;
        return td;
      }

      function openTeam(id) {
        location.href = "../team/?team=" + encodeURIComponent(id);
      }

      var leagueId = null;
      try { leagueId = localStorage.getItem(KEY); } catch (e) { leagueId = null; }
      if (!leagueId) {
        empty.hidden = false;
        return;
      }

      var filter = encodeURIComponent('league="' + leagueId + '"');
      var me = auth();

      Promise.all([
        api("/api/collections/roster_leagues/records/" + leagueId),
        api("/api/collections/roster_teams/records?filter=" + filter + "&perPage=100&sort=created"),
        api("/api/collections/roster_league_members/records?filter=" + filter + "&perPage=100")
      ]).then(function (results) {
        var league = results[0];
        var teams = results[1].items;
        var memberCount = results[2].totalItems;

        document.getElementById("league-title").textContent = league.name;
        document.getElementById("league-code").textContent = league.code;
        document.getElementById("member-count").textContent = memberCount + (memberCount === 1 ? " member" : " members");
        document.getElementById("team-count").textContent = teams.length + " named";

        rows.textContent = "";
        teams.forEach(function (team, i) {
          var tr = document.createElement("tr");
          tr.tabIndex = 0;
          if (me && team.user === me.id) tr.className = "mine";
          tr.appendChild(cell("rank", String(i + 1)));

          var name = cell("team", team.name);
          tr.appendChild(name);
          tr.appendChild(cell("owner", team.ownerName || "Owner"));
          tr.appendChild(cell("num", "0 of " + ROSTER_SIZE));

          tr.addEventListener("click", function () { openTeam(team.id); });
          tr.addEventListener("keydown", function (event) {
            if (event.key === "Enter") openTeam(team.id);
          });
          rows.appendChild(tr);
        });

        var missing = memberCount - teams.length;
        var note = document.getElementById("unnamed-note");
        note.hidden = missing <= 0;
        note.textContent = missing === 1
          ? "One member hasn't named a team yet."
          : missing + " members haven't named a team yet.";

        body.hidden = false;
      }).catch(function (err) {
        empty.hidden = false;
        empty.textContent = err.message;
      });
    })();
  </script>
</body>
</html>
