<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View league · Roster</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #a3a3a3;
      --lime: #a3ff12;
      --lime-text: #000000;
      --field: #141416;
      --line: #3a3a40;
      --error: #ff6b6b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px 48px;
    }
    main { max-width: 760px; margin: 0 auto; }
    .back { font-weight: 600; color: var(--lime); text-decoration: none; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 6px; }
    .muted { color: var(--muted); margin: 0 0 20px; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.2rem; letter-spacing: 0.2em; color: var(--lime); }
    .sub-title { font-size: 1.1rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; margin: 28px 0 12px; }
    .team-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .team-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .team-card h4 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .team-card .owner { margin: 2px 0 8px; font-size: 0.85rem; color: var(--muted); }
    .team-card .players { margin: 0; font-size: 0.85rem; color: var(--muted); opacity: 0.8; }
    .panel { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin-top: 16px; }
    .panel label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); }
    .panel input { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    .panel input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
    .btn { font: inherit; font-weight: 700; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--lime); background: var(--lime); color: var(--lime-text); cursor: pointer; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .msg { min-height: 1.5em; margin: 12px 0 0; font-size: 0.9rem; color: var(--error); }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <main>
    <a class="back" href="../">← Back to Roster</a>
    <h1 id="league-title">View league</h1>
    <p class="muted" id="league-invite">Invite code: <strong class="code" id="league-code"></strong></p>

    <p class="muted" id="empty" hidden>Pick a league on the home page first.</p>

    <div id="league-body" hidden>
      <h2 class="sub-title">Teams</h2>
      <div class="team-list" id="team-list"></div>
      <p class="muted" id="unnamed-note" hidden></p>
      <form class="panel" id="team-form" hidden>
        <label>Your team name
          <input id="team-name" type="text" maxlength="40" required>
        </label>
        <button class="btn" type="submit">Save team name</button>
      </form>
      <p class="msg" id="team-msg" role="alert"></p>
    </div>
  </main>
  <script>
    // Shows the league you picked on the home page: its teams, owners, and players.
    (function () {
      var KEY = "roster_league";
      var empty = document.getElementById("empty");
      var body = document.getElementById("league-body");
      var teamList = document.getElementById("team-list");
      var teamForm = document.getElementById("team-form");
      var teamName = document.getElementById("team-name");
      var teamMsg = document.getElementById("team-msg");
      var unnamed = document.getElementById("unnamed-note");

      function token() {
        var saved = window.rosterAuth && window.rosterAuth.current();
        return saved ? saved.token : "";
      }

      function myId() {
        var saved = window.rosterAuth && window.rosterAuth.current();
        return saved ? saved.id : "";
      }

      function api(path, method, data) {
        return fetch(path, {
          method: method || "GET",
          headers: { "Content-Type": "application/json", Authorization: token() },
          body: data ? JSON.stringify(data) : undefined
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (json) {
            if (!res.ok) throw new Error(json.message || "Something went wrong.");
            return json;
          });
        });
      }

      function leagueId() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }

      function loadTeams(id) {
        var filter = encodeURIComponent('league="' + id + '"');
        return Promise.all([
          api("/api/collections/roster_teams/records?filter=" + filter + "&perPage=100&sort=created"),
          api("/api/collections/roster_league_members/records?filter=" + filter + "&perPage=100")
        ]).then(function (results) {
          var teams = results[0].items;
          var memberCount = results[1].totalItems;
          var mine = teams.filter(function (t) { return t.user === myId(); })[0];

          teamList.textContent = "";
          teams.forEach(function (team) {
            var card = document.createElement("div");
            card.className = "team-card";
            var name = document.createElement("h4");
            name.textContent = team.name;
            var owner = document.createElement("p");
            owner.className = "owner";
            owner.textContent = team.ownerName || "Owner";
            var players = document.createElement("p");
            players.className = "players";
            players.textContent = "No players yet";
            card.appendChild(name);
            card.appendChild(owner);
            card.appendChild(players);
            teamList.appendChild(card);
          });

          var missing = memberCount - teams.length;
          unnamed.hidden = missing <= 0;
          unnamed.textContent = missing === 1
            ? "One member hasn't named a team yet."
            : missing + " members haven't named a team yet.";

          teamForm.hidden = false;
          teamName.value = mine ? mine.name : "";
          teamForm.dataset.teamId = mine ? mine.id : "";
        });
      }

      var id = leagueId();
      if (!id) {
        empty.hidden = false;
        return;
      }

      api("/api/collections/roster_leagues/records/" + id).then(function (league) {
        document.getElementById("league-title").textContent = league.name;
        document.getElementById("league-code").textContent = league.code;
        body.hidden = false;
        return loadTeams(id);
      }).catch(function (err) {
        empty.hidden = false;
        empty.textContent = err.message;
      });

      teamForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var teamId = teamForm.dataset.teamId;
        var name = teamName.value.trim();
        var auth = window.rosterAuth && window.rosterAuth.current();
        var ownerName = auth && auth.name ? auth.name : "";
        teamMsg.textContent = "Saving...";

        var request = teamId
          ? api("/api/collections/roster_teams/records/" + teamId, "PATCH", { name: name })
          : api("/api/collections/roster_teams/records", "POST", {
              league: id, user: myId(), name: name, ownerName: ownerName
            });

        request.then(function () {
          teamMsg.textContent = "";
          return loadTeams(id);
        }).catch(function (err) {
          teamMsg.textContent = err.message;
        });
      });
    })();
  </script>
</body>
</html>
