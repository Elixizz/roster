<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your free agency · Roster</title>
  <style>
    :root { --bg: #000000; --bg-gradient: radial-gradient(120% 90% at 0% 0%, #1a2c04 0%, #0b1402 32%, transparent 62%), radial-gradient(120% 90% at 100% 100%, #1a2c04 0%, #0b1402 32%, transparent 62%); --text: #ffffff; --muted: #a3a3a3; --accent: #a3ff12; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background-color: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main { text-align: center; max-width: 560px; width: 100%; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); font-weight: 900; line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Your free agency</h1>
    <p>Coming soon.</p>
    <a href="../">← Back to Roster</a>
  </main>
</body>
</html>
