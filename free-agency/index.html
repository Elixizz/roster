<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your free agency · Roster</title>
  <style>
    :root { --bg: #000000; --bg-gradient: radial-gradient(120% 90% at 0% 0%, #1a2c04 0%, #0b1402 32%, transparent 62%), radial-gradient(120% 90% at 100% 100%, #1a2c04 0%, #0b1402 32%, transparent 62%); --panel: #0d0d0d; --line: #2a2a2a; --text: #ffffff; --muted: #a3a3a3; --accent: #a3ff12; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background-color: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 48px; }
    header { padding: 20px 0 8px; }
    .back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 900; line-height: 1.1; margin: 8px 0 4px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 14px; }
    .filters button {
      font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      padding: 6px 14px; border-radius: 999px; border: 2px solid var(--accent);
      background: transparent; color: var(--accent);
    }
    .filters button[aria-pressed="true"] { background: var(--accent); color: #000; }
    .filters button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .search { display: flex; gap: 8px; margin-top: 20px; }
    .search input, .search select {
      font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; min-width: 0;
    }
    .search input { flex: 1 1 60%; }
    .search select { flex: 0 1 40%; }
    .search input:focus-visible, .search select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .count { color: var(--muted); font-size: 0.85rem; margin: 0 0 8px; }
    .avatar { overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .filters.groups { margin-bottom: 8px; }
    .filters.groups button { font-size: 0.95rem; padding: 8px 16px; }
    #filters { margin-top: 0; }
    #filters button { border-width: 1px; padding: 4px 12px; font-size: 0.85rem; }
    #filters:empty { display: none; }
    .filters .n { font-weight: 500; opacity: 0.75; margin-left: 4px; }

    .list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .head, .player { display: grid; grid-template-columns: 44px 44px 1fr 56px; align-items: center; gap: 12px; padding: 10px 14px; }
    .head { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); }
    .player + .player { border-top: 1px solid var(--line); }
    .rank { color: var(--muted); font-weight: 700; text-align: right; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #1c1c1c; display: grid; place-items: center; color: #555; }
    .avatar svg { width: 22px; height: 22px; }
    .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .name.empty { color: #555; font-weight: 500; font-style: italic; }
    .team { display: block; color: var(--muted); font-size: 0.8rem; font-weight: 400; font-style: normal; }
    .pos { justify-self: start; font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); }
    .none { padding: 24px; color: var(--muted); text-align: center; }

    @media (max-width: 480px) {
      .head, .player { grid-template-columns: 28px 36px 1fr 52px; gap: 8px; padding: 10px; }
      .avatar { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <script src="/roster/assets/auth.js"></script>
  <div class="wrap">
    <header>
      <a class="back" href="../">← Back to Roster</a>
      <h1>Your free agency</h1>
      <p class="sub">Every player on an NFL 53-man roster<span id="updated"></span>.</p>
    </header>

    <div class="search">
      <input id="q" type="search" placeholder="Search players" aria-label="Search players" autocomplete="off">
      <select id="team" aria-label="NFL team"><option value="">All teams</option></select>
    </div>
    <div class="filters groups" id="groups" role="group" aria-label="Filter by position group"></div>
    <div class="filters" id="filters" role="group" aria-label="Filter by position"></div>

    <p class="count" id="count" aria-live="polite"></p>
    <div class="list" role="table" aria-label="Free agents">
      <div class="head" role="row">
        <span class="rank" role="columnheader">#</span>
        <span role="columnheader" aria-label="Photo"></span>
        <span role="columnheader">Player</span>
        <span role="columnheader">Pos</span>
      </div>
      <ul id="players" style="list-style:none;margin:0;padding:0" role="rowgroup"></ul>
    </div>
  </div>

  <script src="data/players.js"></script>
  <script>
  (function () {
    var GROUPS = [
      { id: "all", label: "All", positions: null },
      { id: "offense", label: "Offense", positions: ["QB", "RB", "WR", "TE"] },
      { id: "oline", label: "Offensive line", positions: ["C", "G", "T"] },
      { id: "defense", label: "Defense", positions: ["DE", "DT", "LB", "CB", "S"] },
      { id: "special", label: "Special teams", positions: ["K", "P", "LS"] }
    ];
    var ORDER = [].concat.apply([], GROUPS.slice(1).map(function (g) { return g.positions; }));
    var NAMES = { QB: "Quarterback", RB: "Running back", WR: "Wide receiver", TE: "Tight end",
      C: "Center", G: "Guard", T: "Tackle", DE: "Defensive end", DT: "Defensive tackle",
      LB: "Linebacker", CB: "Cornerback", S: "Safety", K: "Kicker", P: "Punter", LS: "Long snapper" };
    var players = (window.FREE_AGENTS || []).filter(function (p) { return ORDER.indexOf(p.pos) >= 0; });
    var silhouette = window.SILHOUETTE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';

    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
    var TEAMS = { ARI: "Arizona Cardinals", ATL: "Atlanta Falcons", BAL: "Baltimore Ravens", BUF: "Buffalo Bills",
      CAR: "Carolina Panthers", CHI: "Chicago Bears", CIN: "Cincinnati Bengals", CLE: "Cleveland Browns",
      DAL: "Dallas Cowboys", DEN: "Denver Broncos", DET: "Detroit Lions", GB: "Green Bay Packers",
      HOU: "Houston Texans", IND: "Indianapolis Colts", JAX: "Jacksonville Jaguars", KC: "Kansas City Chiefs",
      LA: "Los Angeles Rams", LAC: "Los Angeles Chargers", LV: "Las Vegas Raiders", MIA: "Miami Dolphins",
      MIN: "Minnesota Vikings", NE: "New England Patriots", NO: "New Orleans Saints", NYG: "New York Giants",
      NYJ: "New York Jets", PHI: "Philadelphia Eagles", PIT: "Pittsburgh Steelers", SEA: "Seattle Seahawks",
      SF: "San Francisco 49ers", TB: "Tampa Bay Buccaneers", TEN: "Tennessee Titans", WAS: "Washington Commanders" };
    var qEl = document.getElementById("q"), teamEl = document.getElementById("team");
    Object.keys(TEAMS).sort(function (a, b) { return TEAMS[a] < TEAMS[b] ? -1 : 1; }).forEach(function (t) {
      if (!players.some(function (p) { return p.team === t; })) return;
      var o = document.createElement("option"); o.value = t; o.textContent = TEAMS[t]; teamEl.appendChild(o);
    });
    if (window.FREE_AGENTS_UPDATED) document.getElementById("updated").textContent = " · " + window.FREE_AGENTS_UPDATED;

    // Search and team narrow everything, including the counts on the buttons.
    function fold(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
    function base() {
      var q = fold(qEl.value.trim()), t = teamEl.value;
      return players.filter(function (p) {
        return (!t || p.team === t) && (!q || fold(p.name).indexOf(q) >= 0);
      });
    }
    var pool = players;
    function count(list) { return pool.filter(function (x) { return !list || list.indexOf(x.pos) >= 0; }).length; }

    // Group players by position (in the order above), then by last name.
    function lastFirst(n) { var parts = String(n || "").split(" "); return fold(parts.slice(1).join(" ") + " " + parts[0]); }
    players.forEach(function (p) { p._key = lastFirst(p.name); });
    players.sort(function (a, b) {
      return (ORDER.indexOf(a.pos) - ORDER.indexOf(b.pos)) || (a._key < b._key ? -1 : a._key > b._key ? 1 : 0);
    });

    // URL hash is a group id ("#defense") or a position ("#lb").
    function state() {
      var h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      var pos = ORDER.indexOf(h.toUpperCase()) >= 0 ? h.toUpperCase() : null;
      var group = GROUPS.filter(function (g) {
        return pos ? g.positions && g.positions.indexOf(pos) >= 0 : g.id === h;
      })[0] || GROUPS[0];
      return { group: group, pos: pos };
    }

    function btn(attr, value, label, pressed, n, title) {
      return '<button type="button" ' + attr + '="' + value + '" aria-pressed="' + pressed + '"' +
        (title ? ' title="' + title + '"' : '') + '>' + label + '<span class="n">' + n + '</span></button>';
    }

    function render() {
      var st = state();
      pool = base();
      document.getElementById("groups").innerHTML = GROUPS.map(function (g) {
        return btn("data-group", g.id, g.label, g === st.group, count(g.positions));
      }).join("");
      document.getElementById("filters").innerHTML = st.group.positions ? st.group.positions.map(function (p) {
        return btn("data-pos", p.toLowerCase(), p, p === st.pos, count([p]), NAMES[p]);
      }).join("") : "";

      var show = st.pos ? [st.pos] : st.group.positions;
      var list = pool.filter(function (x) { return !show || show.indexOf(x.pos) >= 0; });
      var el = document.getElementById("players");
      document.getElementById("count").textContent = list.length + (list.length === 1 ? " player" : " players");
      if (!list.length) { el.innerHTML = '<li class="none">No players match.</li>'; return; }
      el.innerHTML = list.map(function (p, i) {
        var hasName = p.name && p.name.trim();
        return '<li class="player" role="row">' +
          '<span class="rank" role="cell">' + (i + 1) + '</span>' +
          '<span class="avatar" role="cell">' + (p.photo
            ? '<img src="https://static.www.nfl.com/image/upload/f_auto,q_auto/league/' + encodeURIComponent(p.photo) +
              '" alt="" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML=SILHOUETTE">'
            : silhouette) + '</span>' +
          '<span class="name' + (hasName ? '' : ' empty') + '" role="cell">' +
            (hasName ? esc(p.name) : 'Empty profile') +
            '<span class="team">' + (p.team ? esc(TEAMS[p.team] || p.team) : '—') + (p.num ? ' · #' + esc(p.num) : '') + '</span></span>' +
          '<span class="pos" role="cell" title="' + NAMES[p.pos] + '">' + esc(p.pos) + '</span>' +
        '</li>';
      }).join("");
    }

    function go(hash) {
      history.replaceState(null, "", hash ? "#" + hash : location.pathname + location.search);
      render();
    }
    document.getElementById("groups").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-group]");
      if (b) go(b.getAttribute("data-group") === "all" ? "" : b.getAttribute("data-group"));
    });
    document.getElementById("filters").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-pos]");
      if (!b) return;
      // Clicking the active position again goes back to its whole group.
      go(b.getAttribute("aria-pressed") === "true" ? state().group.id : b.getAttribute("data-pos"));
    });
    window.addEventListener("hashchange", render);
    qEl.addEventListener("input", render);
    teamEl.addEventListener("change", render);
    render();
  })();
  </script>
</body>
</html>
