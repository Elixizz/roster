<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roster">
  <link rel="manifest" href="/roster/assets/manifest.json">
  <link rel="icon" href="/roster/assets/icon.svg" type="image/svg+xml">
  <title>Log in · Roster</title>
  <link rel="stylesheet" href="/roster/assets/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + var(--safe-bottom)); }
    main { width: 100%; max-width: 380px; }
    .brand-mark { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; text-align: center; }
    .brand-mark img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 40px rgba(163, 255, 18, 0.25); }
    .brand-mark h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; }
    .brand-mark p { margin: 0; color: var(--muted); }
    .auth-card { padding: 20px; }
    .switch { margin-top: 14px; text-align: center; color: var(--muted); font-size: 0.95rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand-mark">
      <img src="/roster/assets/icon.svg" alt="">
      <h1>Roster</h1>
      <p>Your team. Free agency.</p>
    </div>
    <form class="ui-card ui-form auth-card" id="auth-form">
      <label class="ui-field hidden" id="name-field">Name
        <input class="ui-input" id="name" type="text" autocomplete="name" maxlength="80" placeholder="Your name">
      </label>
      <label class="ui-field">Email
        <input class="ui-input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label class="ui-field">Password
        <input class="ui-input" id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
      </label>
      <button class="ui-btn primary block" id="submit" type="submit">Log in</button>
      <p class="ui-msg" id="msg" role="alert"></p>
    </form>
    <p class="switch"><button class="ui-link" id="toggle" type="button">No account? Create one</button></p>
  </main>
  <script>
    (function () {
      var API = "/api/collections/roster_users";
      var signingUp = false;
      var form = document.getElementById("auth-form");
      var nameField = document.getElementById("name-field");
      var nameInput = document.getElementById("name");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var submit = document.getElementById("submit");
      var toggle = document.getElementById("toggle");
      var msg = document.getElementById("msg");

      // Only allow redirects back inside the roster site.
      function nextPath() {
        var next = new URLSearchParams(location.search).get("next") || "/roster/";
        return next.indexOf("/roster/") === 0 && next.indexOf("//") !== 0 ? next : "/roster/";
      }

      function setMode(isSignup) {
        signingUp = isSignup;
        nameField.classList.toggle("hidden", !isSignup);
        submit.textContent = isSignup ? "Create account" : "Log in";
        toggle.textContent = isSignup ? "Have an account? Log in" : "No account? Create one";
        passwordInput.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
        msg.textContent = "";
      }

      function fail(text) {
        msg.textContent = text;
        submit.disabled = false;
        submit.textContent = signingUp ? "Create account" : "Log in";
      }

      function readError(res) {
        return res.json().then(function (data) { return data.message || "Something went wrong."; },
          function () { return "Something went wrong."; });
      }

      function logIn(email, password) {
        return fetch(API + "/auth-with-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identity: email, password: password })
        }).then(function (res) {
          if (!res.ok) return readError(res).then(function (text) { throw new Error(text); });
          return res.json();
        });
      }

      toggle.addEventListener("click", function () { setMode(!signingUp); });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        submit.disabled = true;
        msg.textContent = "";
        submit.textContent = signingUp ? "Creating account..." : "Logging in...";

        var step = signingUp
          ? fetch(API + "/records", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: email,
                password: password,
                passwordConfirm: password,
                name: nameInput.value.trim()
              })
            }).then(function (res) {
              if (!res.ok) return readError(res).then(function (text) { throw new Error(text); });
            })
          : Promise.resolve();

        step
          .then(function () { return logIn(email, password); })
          .then(function (data) {
            if (window.rosterAuth) {
              window.rosterAuth.save({ token: data.token, email: data.record.email, name: data.record.name || "" });
            }
            location.replace(nextPath());
          })
          .catch(function (err) {
            fail(err.message === "Failed to fetch" ? "Could not reach the server." : err.message);
          });
      });

      setMode(false);
    })();
  </script>
  <script src="/roster/assets/auth.js"></script>
</body>
</html>
